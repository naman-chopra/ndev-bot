<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ndev Dev Deck</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="header-left">
        <div class="logo-icon">N</div>
        <div>
          <h1>Ndev Dev Deck</h1>
          <p class="subtitle" id="user-greeting">Developer Console</p>
        </div>
      </div>
      <div class="status-indicator online">
        <span class="dot"></span>
        <span class="status-text">Online</span>
      </div>
    </header>

    <main class="content">
      <!-- Active Projects Section -->
      <section class="section">
        <h2 class="section-title">Active Projects</h2>
        <div id="projects-container">
          <div class="card" style="text-align: center; color: var(--hint-color); padding: 24px;">
            Scanning GitHub repositories...
          </div>
        </div>
      </section>

      <!-- Bot Commands Reference -->
      <section class="section">
        <h2 class="section-title">Quick Controls</h2>
        <div class="card">
          <ul class="control-list">
            <li>
              <strong>/start</strong>
              <span>Interactive project selector & buttons</span>
            </li>
            <li>
              <strong>/status</strong>
              <span>Check 24/7 background monitors</span>
            </li>
            <li>
              <strong>/id</strong>
              <span>View Chat ID & Telegram routing</span>
            </li>
          </ul>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>Ndev Developer Deck • Powered by Telegram Mini Apps</p>
    </footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
